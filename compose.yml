services:
  artiscrapper:
    build: .
    ports:
      # Override on busy hosts: HOST_PORT=8001 docker compose up
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data/cache.db:/app/cache.db  # sqlite bind-mount (DEPLOY-06)
    environment:
      - CACHE_DB_PATH=/app/cache.db
      - LLM_ROUTER_URL=${LLM_ROUTER_URL:-http://host.docker.internal:3210}
      - LLM_ROUTER_BEARER_TOKEN=${LLM_ROUTER_BEARER_TOKEN}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b-instruct-q4_K_M}
      # BROWSER-04 (Path B 2026-06-04): 0 enables the 2 Google fetches inside
      # a single /search request to run truly parallel. Was 60 (added ~60s to
      # every cold path). slowapi consumer rate-limit is the primary defense.
      - GOOGLE_MIN_INTERVAL_S=${GOOGLE_MIN_INTERVAL_S:-0}
      - BROWSER_RECYCLE_AFTER=200
      # LLM-03 (Path B 2026-06-04): empirically optimal against local-llms-router.
      # Was 4 — sem(4) ≈ sem(2) throughput. 8 maximizes use without saturating
      # OpenWebUI / other shared local-llms consumers.
      - LLM_CONCURRENCY=${LLM_CONCURRENCY:-8}
      - LOG_JSON=true
      - LOG_LEVEL=INFO
      # ── Phase 3 — Robustness ──
      # D-01: comma-separated API keys; empty default ⇒ all requests get 401.
      # Set via .env or shell export before `docker compose up`.
      - API_KEYS=${API_KEYS:-}
      # D-02 / Phase 3.1 D-05: per-key quotas wired into the slowapi
      # decorators on POST /search via module-level constants
      # (_RATE_LIMIT_PER_MINUTE / _RATE_LIMIT_PER_DAY in main.py). Bumping
      # these vars + `compose up --force-recreate` updates the runtime
      # hot path AND the `rate_limit_init` log line by construction.
      - API_RATE_PER_MINUTE=${API_RATE_PER_MINUTE:-60}
      - API_RATE_PER_DAY=${API_RATE_PER_DAY:-10000}
      # D-14: empty default ⇒ Sentry SDK init is skipped. Set in production
      # only; never set in dev/test (PRD: off by default).
      - SENTRY_DSN=${SENTRY_DSN:-}
    extra_hosts:
      # Make host.docker.internal resolve on Linux Docker (without Docker Desktop).
      # No-op on Docker Desktop where it's already wired by default.
      - "host.docker.internal:host-gateway"
    init: true  # equivalent to tini if not using ENTRYPOINT tini
    # Auto-restart al reinicio del WSL/Docker daemon. "unless-stopped" respeta
    # `docker compose down` (no se reinicia manualmente bajado), pero vuelve
    # arriba si el daemon se reinicia (caso típico: reboot de Windows con
    # Docker Desktop autostart, o cierre de la distro WSL).
    restart: unless-stopped
