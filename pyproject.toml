[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artiscrapper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "cloakbrowser==0.3.31",
    "aiosqlite==0.22.1",
    "selectolax==0.4.10",
    "httpx[http2]==0.28.1",
    "structlog==25.5.0",
    "asgi-correlation-id==5.0.0",
    "orjson==3.11.9",
    "tldextract==5.3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff>=0.15",
    "mypy>=2.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artiscrapper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: live network tests (skipped by default)"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
